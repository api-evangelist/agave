description: >-
  Agave publishes a dated product changelog at https://useagave.com/product-updates, paginated (3
  pages at the time of capture) and filterable by product — ERP Sync, Vendor Compliance, Agave MCP,
  AI Analytics, Expense Management, AP Automation. It is a PRODUCT changelog, not an API changelog:
  entries describe portal and workflow features, and none of them state an API-Version change,
  endpoint addition or field addition. A developer tracking the REST contract has no dated feed to
  follow — the API version has not moved since 2021-11-21 and additive endpoint changes ship silently
  by Agave's own stated policy.
