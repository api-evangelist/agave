tools_note: >-
  No tool list is published anywhere on Agave's public surface, so none is recorded. The marketing
  page describes the capability in prose only ("show me all expenses coded to [job]", "what's the
  current cost-to-complete on the [project]?", "which invoices from [vendor] are still unpaid?").
  These are example PROMPTS, not tool names, and are not transcribed as tools here.
capability_notes:
  read_only: >-
    Agave states the AI surface is read-only by design — "Agave AI Analytics can never create, edit,
    or delete records in your ERP or PM systems" — with role-based permissions and employee/payroll
    records excluded at the integration level so they cannot be queried.
  data_scope: >-
    Procore, Autodesk Build and 13+ construction ERPs, via the same integrations that back the REST
    API.
