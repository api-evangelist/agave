description: >-
  Agave MCP is a shipped, named Agave product — "Interact with your ERP & PM data securely in
  ChatGPT, Claude, or Copilot" — listed in the site navigation, the pricing page and the footer
  alongside ERP Sync, AP Automation, Expense Management, AI Analytics and Vendor Compliance. It
  exposes the same read-only construction data as Agave AI Analytics to an assistant the customer
  already licenses. Agave publishes NO connection details: no endpoint URL, no install command, no
  package, no tool list, and no MCP page in the developer docs. The only calls to action are "Get
  started" and "Book a demo", and pricing for it is a platform fee plus seats quoted by sales.
