note: >-
  No /.well-known/ discovery document is served on any Agave host. Two distinct negative shapes were
  observed and both are recorded below rather than collapsed. (1) api.agaveapi.com — the real API
  host, which answers a JSON 404 for unknown routes at the root — returns HTTP 403 with a 520-byte
  text/html body for EVERY /.well-known/* path, i.e. an edge rule blocks the whole namespace before
  the application sees it. (2) docs.agaveapi.com (Docusaurus on GitHub Pages) and useagave.com
  (Webflow) return their ordinary 404 pages. Because nothing returned a 200 carrying a real
  document, NO WellKnown and NO SecurityTxt pointer is emitted for this provider. The 8,098-byte
  docs body and the 88-byte useagave.com body are the sites' standard 404 pages, not catch-all 200s.
