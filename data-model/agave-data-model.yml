description: 'Entity graph of the Agave unified construction data model, derived from the 228 paths in
  the OpenAPI projected from Agave''s own Postman collection. Agave''s model is deliberately FLAT: 73
  top-level collections, each addressed by its own Agave-assigned UUID, with containment expressed as
  sub-resources (line-items, attachments, versions, contacts, viewpoints) rather than as $ref links between
  schemas. Cross-entity relationships live in ID FIELDS inside payloads, which the Postman collection
  does not enumerate, so this file records the containment graph it can prove and does not invent the
  reference graph it cannot.'
identity:
  scheme: Agave-assigned UUID per object, plus the source system's own identifier
  fields:
  - field: id
    description: Agave UUID, stable per linked account. Documented at https://docs.agaveapi.com/agave-api/identifiers
  - field: source_id
    description: The object's native identifier in the connected source system.
  caveat: 'Agave ids are derived per Reference ID: the SAME underlying source-system object linked under
    a different reference_id yields a DIFFERENT Agave id. Agave states this explicitly at https://docs.agaveapi.com/agave-api/reference-id.
    An agent must not treat an Agave id as a global key for a real-world object.'
  prefixes: null
  prefixes_note: Agave uses bare UUIDs with no type prefix, so an id carries no type information.
envelope:
  list: data[] + meta{current_page, has_more_results}
  single: object
  raw_passthrough: source_data (opt-in via Include-Source-Data)
