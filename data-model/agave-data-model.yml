relationships_note: Containment relationships are recorded on each entity as sub_resources — e.g. ap-invoices
  has_many line-items at /ap-invoices/{ap_invoice_id}/line-items, customers has_many contacts, coordination-issues
  has_many viewpoints and attachments, drawings has_many versions. belongs_to edges (an invoice's project_id,
  a budget line's cost_code_id) are carried in request and response BODIES; Agave publishes no schema
  for those bodies and the Postman collection only supplies per-request examples, so the field-level reference
  graph is NOT asserted here. Recovering it would require an authenticated crawl, which this pipeline
  does not perform.
scoping:
  project: Project-Id header scopes PM and field-service resources to one Agave project UUID; "*" returns
    all project-level records on supporting endpoints.
  company: Company-Id header selects the company when cross-company access was granted.
  account: Account-Token selects the linked source-system account — the top of every scope chain.
