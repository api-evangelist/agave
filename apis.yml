- type: Features
  data:
  - name: Unified Construction API
    description: Single REST API to read and write data across 100+ construction and
      accounting software systems with normalized data models.
  - name: Agave Link Authentication
    description: Pre-built front-end component for user authentication that handles
      OAuth flows for all supported construction software platforms.
  - name: ERP Sync
    description: Automatic synchronization of jobs, financials, timesheets, and cost
      data between field systems and ERP platforms.
  - name: AP Invoice Automation
    description: AI-powered invoice capture, job matching, cost code coding, approval
      routing, and ERP sync for accounts payable workflows.
  - name: Passthrough Requests
    description: Direct passthrough of requests to source system APIs with Agave handling
      authentication and protocol translation.
  - name: Webhooks
    description: Real-time webhook notifications for data changes in connected construction
      software systems.
  - name: Sandbox Environments
    description: Sandbox mode for testing integrations without affecting production
      data in connected systems.
  - name: Agave File Manager
    description: Pre-built front-end component for browsing and selecting files from
      connected construction document storage systems.
- type: UseCases
  data:
  - name: Construction Software Integration
    description: Construction software companies integrate with 100+ other platforms
      via a single API instead of building and maintaining individual integrations.
  - name: ERP and PM Sync
    description: Automatically sync jobs, cost codes, and financials between project
      management systems like Procore and ERP systems like QuickBooks or Sage.
  - name: Invoice Processing Automation
    description: Automate AP invoice capture, job matching, and ERP posting using
      AI-powered invoice processing workflows.
  - name: Job Costing
    description: Pull budget, contract, commitment, and cost data from construction
      software for real-time job cost analysis and reporting.
  - name: Timesheet Integration
    description: Sync employee timesheets from field systems to accounting ERPs to
      eliminate manual payroll data entry.
  - name: Document Management
    description: Enable users to select and share files from connected construction
      document storage systems using Agave File Manager.
- type: Integrations
  data:
  - name: Procore
    description: Full read/write integration with Procore for projects, budgets, contracts,
      commitments, and documents.
  - name: Autodesk Build
    description: Integration with Autodesk Build for project management and document
      storage.
  - name: QuickBooks Online
    description: Integration with QuickBooks Online for job costing, invoices, and
      financial data.
  - name: Sage 100 Contractor
    description: Integration with Sage 100 Contractor for construction job costing
      and accounting.
  - name: Sage Intacct
    description: Integration with Sage Intacct cloud ERP for construction financial
      management.
  - name: Viewpoint Vista
    description: Integration with Viewpoint Vista for construction ERP including SQL-based
      data access.
  - name: ServiceTitan
    description: Integration with ServiceTitan for field service management and job
      costing.
  - name: Acumatica
    description: Integration with Acumatica cloud ERP for construction financial management.
  - name: Foundation
    description: Integration with Foundation construction accounting software.
  - name: CMiC
    description: Integration with CMiC enterprise construction ERP platform.
