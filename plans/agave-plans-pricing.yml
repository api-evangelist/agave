description: 'Agave publishes NO list prices and no tiers. The pricing page (https://useagave.com/pricing,
  HTTP 200 on 2026-08-30 — the older https://www.agaveapi.com/software-vendors/pricing/ now redirects
  here) describes a three-step sales motion instead: discovery call, personalised demo, custom proposal.
  Six products are named with their pricing SHAPE but no number attached, so plan_count is 0 — an honest
  zero, not a gap in this artifact. Every product is sold standalone with bundling discounts, and the
  subscription is sized to the customer''s business rather than to a fixed tier.'
notes: Replaces a 2026-05-04 generated artifact that invented a single "agave-custom" plan with a module
  list and contract entitlements not present on any current Agave page. Those entitlements (99% uptime
  with credits, SOC 2 Type I/II, annual penetration testing, the Core/AP/AR/Workforce/Forecast module
  split) are NOT published on useagave.com/pricing today and have been removed rather than carried forward.
  The pricing shapes below are quoted from the live page.
