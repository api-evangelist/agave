sales_process:
- step: 1
  name: Quick Discovery
  detail: Agave responds within one business day to establish trades, team size, ERP and PM systems.
- step: 2
  name: Personalized demo
  detail: 30-minute walkthrough on the prospect's own software stack.
- step: 3
  name: Custom proposal
  detail: Priced on the products selected, with bundling discounts, sized to the business rather than
    a fixed tier.
api_metering: null
api_metering_note: No per-request, per-call or per-connection API price is published anywhere. The one
  usage signal Agave exposes at runtime is the Agave-Billing-Id / Agave-Billing-Enabled header pair, which
  identifies the linked company being billed and whether it counts as production — implying billing is
  per active monthly Linked Account, but Agave does not state a rate.
