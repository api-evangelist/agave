products:
- name: ERP Sync
  pricing_shape:
  - Flexible subscription based on your business size
  - Scales with the modules you need
  - Available standalone
  description: Keep jobs, financials, timesheets and more in sync across PM and ERP systems.
- name: AP Invoice Automation
  pricing_shape:
  - Flexible subscription based on your business size
  - One-time implementation fee
  - Available standalone
  description: AI captures invoices, matches job and cost code, routes approvals, syncs to the ERP.
- name: Expense Management
  pricing_shape:
  - Flexible subscription based on your business size
  - One-time implementation fee
  - Available standalone
  description: Capture receipts and auto-code to job, cost code and GL.
- name: AI Analytics
  pricing_shape:
  - Platform fee based on your business size
  - Seat-based pricing by seat type
  - Available standalone
  description: Interactive reports built from plain-English prompts. View-only readers are unlimited and
    free.
- name: Agave MCP
  pricing_shape:
  - Platform fee based on your business size
  - Seat-based pricing by seat type
  description: Read-only ERP and PM data in ChatGPT, Claude or Microsoft Copilot.
- name: Vendor Compliance
  pricing_shape:
